dataset:
  # PRIMARY source: ERDDAP OISST v2.1 FINAL, 0.25 deg, daily; longitude 0-360; dims time,zlev,latitude,longitude
  erddap_base: "https://coastwatch.pfeg.noaa.gov/erddap/griddap/ncdcOisst21Agg"
  dataset_id: "ncdcOisst21Agg"
  variable: "sst"
  # GAP-FILL source (only for days the ERDDAP aggregation lacks: 1,194 days in 1982-2025, mostly 1992-1998).
  # NOAA PSL OPeNDAP, labelled OISST v2 (1982-2015) / v2.1 (2016+). Used only after validation
  # (double fetch + range + day-to-day check + exact match with ERDDAP on overlapping days).
  psl_base: "https://psl.noaa.gov/thredds/dodsC/Datasets/noaa.oisst.v2.highres"
  psl_file_pattern: "sst.day.mean.{year}.nc"   # dims time,lat,lon; longitude 0-360
regions:
  kuroshio:      {lat_min: 30.125, lat_max: 39.875, lon_min: 145.125, lon_max: 154.875}   # high variability
  subtropical:   {lat_min: 15.125, lat_max: 24.875, lon_min: 150.125, lon_max: 159.875}   # low variability
period: {start: "1982-01-01", end: "2025-12-31"}
split:
  train: ["1982-01-01", "2015-12-31"]
  val:   ["2016-01-01", "2019-12-31"]
  test:  ["2020-01-01", "2025-12-31"]
leads_days: [1, 7, 30]
seed: 0
climatology: {years: "train", smoothing: "harmonics3", feb29: "use_feb28"}
ocn_years: 10
ridge:
  # Day 3: alpha grid fixed in advance (13 values, 1e-3 ... 1e3); alpha chosen per region and lead on VALIDATION RMSE (2016-2019).
  # Final Day-4 model = fitted on TRAINING years (1982-2015) ONLY with these alphas (no refit on validation; same as the climatology).
  # Penalty: mean squared error + alpha*|w|^2 on standardised features (training mean/std). Chosen values: results/ridge_alphas.json
  features: "anomaly lags 0..6 + mean anomaly t-29..t"
  fit_years: "train"
  alphas: {kuroshio: {1: 0.0031622776601683794, 7: 0.001, 30: 0.001}, subtropical: {1: 0.01, 7: 0.001, 30: 0.001}}
# ---- Day 4 freeze: remaining decisions written down explicitly (values unchanged since validation) ----
baselines: [persistence, climatology, anomaly_persistence, damped_persistence, ocn, ridge]
damped_persistence: {r_h: "per grid point, lag-h correlation of training-year anomalies"}
skill: {metric: rmse, formula: "1 - error_model/error_reference", references: [climatology, anomaly_persistence],
        primary_reference: anomaly_persistence}
metrics: {primary_acc: temporal, secondary_acc: acc_spatial, weights: "cos(latitude)", groupings: [season, year]}
missing_pairs: "skipped and counted; all methods must be scored on the same pairs"
test_policy: "test period (split.test) evaluated exactly once, after git tag pre-test-freeze; no method/parameter change afterwards"
# ---- LSTM experiment (Part 1: training + VALIDATION only; the test period is never loaded) ----
# Research question: with the SAME information as Ridge (last 30 days of anomaly at one grid point), does a small
# nonlinear model (LSTM) beat Ridge and anomaly persistence? Learning experiment, not an ocean forecasting model.
lstm:
  seq_len: 30                      # input days t-29..t
  inputs: "standardised anomaly + sin/cos(day of year) of each input day -> (30, 3)"
  standardise: "one number per region = std of TRAINING anomalies (1982-2015, harmonics3 climatology)"
  outputs: "standardised anomaly at t+1, t+7, t+30 (leads_days)"
  train_samples: "issue dates whose 30-day window AND all three targets lie in split.train"
  val_samples: "issue dates in split.val whose three targets lie in split.val and whose 30-day history is complete (history may reach into 2015)"
  samples_per_epoch: 200000        # fixed-size random draw of (grid point, issue date) pairs each epoch; validation uses ALL pairs
  hidden_sizes: [32, 64]
  seeds: [0, 1, 2]
  lr: 0.001
  batch_size: 1024
  max_epochs: 30
  patience: 5                      # early stopping on validation loss (MSE in standardised units, mean over the 3 leads)
  num_threads: 4                   # torch.set_num_threads
  # SELECTION RULE (fixed before any run): per region, choose the hidden size H whose MEAN over the 3 seeds of the
  # overall validation RMSE of forecast SST (cos(lat)-weighted, same metric code as the baselines) is lowest;
  # computed per lead, and the H with the lowest mean over the 3 leads is chosen (one H per region).
  selection: "per region: H with the lowest mean (over seeds 0,1,2 and over leads 1,7,30) validation RMSE of SST"
